name: Windows Build Only
on:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt (Robust Manual)
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall==3.1.1
          # Debug output for environment info
          python --version
          pip --version
          # Install Qt with debug logging enabled
          aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 -m qtopenglwidgets qtsql --outputdir C:/Qt
        shell: bash
        env:
          AQT_LOG_LEVEL: "DEBUG"

      - name: Configure CMake
        run: |
          cmake -B build -S horos_win -G "Visual Studio 17 2022" -A x64 -DQt6_DIR="C:/Qt/6.5.3/msvc2019_64/lib/cmake/Qt6"
        shell: bash

      - name: Build
        run: |
          cmake --build build --config Release
        shell: bash

      - name: Create Installer (NSIS)
        run: |
          cd build
          cpack -G NSIS
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorosWin-Installer
          path: build/*.exe
