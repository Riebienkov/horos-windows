name: Windows Build Only
on:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'
          modules: 'qtopenglwidgets qtsql'
          setup-python: 'false' # Используем системный Python GHA, чтобы избежать конфликтов

      - name: Build Application
        run: |
          cmake -B build -S horos_win -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
        shell: cmd

      - name: Create Installer
        run: |
          cd build
          cpack -G NSIS
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorosWin-Installer
          path: build/*.exe
