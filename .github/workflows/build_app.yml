name: Windows Build Only
on:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'
          modules: 'qtopenglwidgets qtsql'
          aqtversion: '==3.1.0' # Фиксируем версию инсталлера для стабильности
          setup-python: 'false'

      - name: Configure CMake
        run: |
          mkdir build
          cmake -B build -S horos_win -G "Visual Studio 17 2022" -A x64
        shell: cmd

      - name: Build Application
        run: cmake --build build --config Release
        shell: cmd

      - name: Create Installer
        run: |
          cd build
          cpack -G NSIS
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorosWin-Installer
          path: build/*.exe
