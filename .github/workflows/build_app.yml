name: Windows Build Only
on:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qt (Manual aqtinstall)
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 -m qtopenglwidgets qtsql
          echo "Qt6_DIR=$PWD/Qt/6.5.3/msvc2019_64/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "$PWD/Qt/6.5.3/msvc2019_64/bin" >> $GITHUB_PATH
        shell: bash

      - name: Configure CMake
        run: cmake -B build -S horos_win -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Create Installer
        run: |
          cd build
          cpack -G NSIS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorosWin-Installer
          path: build/*.exe
