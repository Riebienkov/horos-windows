name: Windows & macOS Build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Configure CMake
        run: cmake -B build -S horos_win -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Create Installer (NSIS)
        run: |
          cd build
          cpack -G NSIS
          
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorosWin-Installer
          path: build/*.exe

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          cache: true

      - name: Configure CMake
        run: cmake -B build -S horos_win

      - name: Build
        run: cmake --build build --config Release

      - name: Create DMG
        run: |
          cd build
          cpack -G DragNDrop
          
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorosMac-DMG
          path: build/*.dmg
